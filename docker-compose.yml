version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: indusense-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - indusense-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: indusense-backend
    restart: always
    environment:
      - FLASK_ENV=production
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=ai_predictive_maintenance_db
      - JWT_SECRET_KEY=production-super-secret-jwt-key-2026!
      - CORS_ORIGINS=*
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - indusense-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: indusense-frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - indusense-net

volumes:
  mongo_data:

networks:
  indusense-net:
    driver: bridge
